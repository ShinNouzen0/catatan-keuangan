<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title>DompetKu - Catatan Keuangan Pribadi</title>
  <meta name="description" content="Aplikasi pencatat keuangan pribadi modern dan minimalis.">
  <meta name="theme-color" content="#08557F">

  <!-- Mobile & PWA App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- iOS & Android Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DompetKu">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="DompetKu">

  <!-- Font Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --canvas: #EEF3F8;
      --surface: #ffffff;
      --paper: #ffffff;
      --ink9: #0A1A2B;
      --ink7: #3A4B5E;
      --ink6: #46586B;
      --line: rgba(10, 26, 43, .1);
      --line2: rgba(10, 26, 43, .22);
      --b100: #DCEFFA;
      --b600: #0E8DD0;
      --b700: #0A6FA6;
      --b800: #08557F;
      --p100: #FCE4F1;
      --p500: #DD2D90;
      --p700: #B8146F;
      --income: var(--b700);
      --expense: var(--p700);
      --primary: var(--b700);
      --onp: #fff;
      --logo: #08557F;
      --glass: rgba(255, 255, 255, .78);
      --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* Dark mode disabled - locked to Light Mode */

    * {
      box-sizing: border-box;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      overflow-x: hidden;
      width: 100%;
      box-sizing: border-box;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: #08557F;
      color: var(--ink9);
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      transition: all .25s var(--ease);
    }

    button:active {
      transform: scale(.97);
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .bg {
      position: fixed;
      inset: -80px;
      z-index: -1;
      filter: blur(40px);
      background: 
        radial-gradient(34% 22% at 90% 8%, rgba(255, 255, 255, .4), transparent 70%),
        radial-gradient(50% 30% at 10% 68%, rgba(221, 45, 144, .95), transparent 72%),
        radial-gradient(45% 28% at 92% 90%, rgba(221, 45, 144, .7), transparent 72%),
        radial-gradient(45% 25% at 84% 52%, rgba(124, 198, 238, .8), transparent 72%),
        linear-gradient(180deg, #08557F 0%, #0A6FA6 38%, #0E8DD0 62%, #0A6FA6 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .1) 0 1px, transparent 1px 7px);
    }

    /* Dark mode bg disabled */

    .app {
      width: 100%;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      padding: 12px 16px 0;
      box-sizing: border-box;
      position: relative;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      padding: 4px 6px 4px 14px;
      box-shadow: 0 12px 30px -16px rgba(8, 50, 80, .6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -.02em;
      flex-shrink: 0;
    }

    .brand svg {
      width: 25px;
      height: 25px;
      flex-shrink: 0;
    }

    #dot {
      transition: transform .32s var(--ease), opacity .32s;
    }

    #dot.go {
      transform: translateX(14px);
      opacity: 0;
    }

    .mnav {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
      gap: 2px;
    }

    .mnav button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .mnav button:hover {
      background: var(--canvas);
    }

    .mnav span#ml {
      white-space: nowrap !important;
      font-size: 12px;
      font-weight: 800;
      padding: 0 4px;
      text-align: center;
      letter-spacing: -0.01em;
      min-width: unset;
      display: inline-block;
    }

    .hero {
      color: #fff;
      padding: 32px 4px 4px;
      position: relative;
      animation: in .6s var(--ease) both;
    }

    .hero .deco {
      position: absolute;
      right: -70px;
      top: -6px;
      width: 270px;
      opacity: .09;
      pointer-events: none;
    }

    .ov {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      line-height: 16px;
    }

    .hero .ov {
      color: #DCEFFA;
    }

    .bal {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-weight: 300;
      font-size: 64px;
      line-height: 70px;
      letter-spacing: -.045em;
      margin: 6px 0 24px;
      position: relative;
    }

    .bal small {
      font-size: 20px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: 0;
      margin-top: 9px;
      color: #DCEFFA;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid rgba(255, 255, 255, .35);
      position: relative;
    }

    .stats div {
      padding: 14px 0 0;
    }

    .stats div + div {
      padding-left: 18px;
      border-left: 1px solid rgba(255, 255, 255, .35);
    }

    .stats small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #DCEFFA;
    }

    .stats b {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .wallets {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      margin: 18px -16px 0;
      padding: 10px 16px 18px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .wallets::-webkit-scrollbar {
      display: none;
    }

    .wc {
      flex: none;
      width: 136px;
      height: 90px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      color: #fff;
      position: relative;
      scroll-snap-align: start;
      filter: drop-shadow(0 6px 8px rgba(8, 50, 80, .25));
      border-radius: 20px;
      transition: transform .25s var(--ease), filter .25s;
    }

    .wc:before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: var(--c);
      -webkit-mask: radial-gradient(circle 9px at 100% 50%, transparent 98%, #000 100%);
      mask: radial-gradient(circle 9px at 100% 50%, transparent 98%, #000 100%);
    }

    .wc:after {
      content: "";
      position: absolute;
      right: 4px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      background: #fff;
    }

    .wc > * {
      position: relative;
      z-index: 1;
    }

    .wc small {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .wc b {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .wc.sel {
      transform: translateY(-6px);
      filter: drop-shadow(0 12px 14px rgba(8, 50, 80, .45));
    }

    .wc.add {
      --c: rgba(10, 26, 43, .55);
    }

    .wc.add b {
      font-size: 13px;
      font-weight: 700;
    }

    .paper {
      margin: 0 -16px;
      background: #ffffff;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-radius: 36px 36px 0 0;
      padding: 32px 20px calc(56px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -24px 50px -24px rgba(8, 50, 80, .55);
    }

    .sec + .sec {
      margin-top: 36px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
    }

    .sh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .sh .ov {
      color: var(--ink6);
    }

    .sh .ov i {
      font-style: normal;
      color: var(--p700);
      margin-right: 10px;
    }

    .chip {
      font-size: 13px;
      font-weight: 700;
      background: var(--b100);
      color: var(--b800);
      padding: 0 14px;
      border-radius: 999px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }

    /* Dark mode chip disabled */

    .seg {
      display: grid;
      grid-template-columns: repeat(var(--n), 1fr);
      position: relative;
      background: var(--canvas);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 20px;
      user-select: none;
    }

    .seg:before {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / var(--n));
      background: var(--surface);
      border-radius: 999px;
      box-shadow: 0 1px 3px rgba(10, 26, 43, .12), inset 0 0 0 2px var(--ac, var(--ink6));
      transform: translateX(calc(var(--i) * 100%));
      transition: transform .32s var(--ease), box-shadow .3s;
    }

    .seg button {
      position: relative;
      min-height: 44px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink6);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .seg button.on {
      color: var(--ink9);
      font-weight: 800;
    }

    .donut {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 20px;
    }

    .donut svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .donut circle[data-c] {
      fill: none;
      cursor: pointer;
      transition: stroke-width .3s var(--ease), opacity .3s;
    }

    .ctr {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      padding: 0 50px;
    }

    .ctr svg {
      width: 28px;
      height: 28px;
      color: var(--ink7);
      margin-bottom: 2px;
    }

    .ctr .n {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink6);
    }

    .ctr .v {
      font-size: 23px;
      line-height: 30px;
      font-weight: 700;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .ctr .p {
      font-size: 12px;
      font-weight: 700;
      background: var(--canvas);
      padding: 2px 10px;
      border-radius: 999px;
      margin-top: 2px;
    }

    .fade {
      display: contents;
      animation: pop .35s var(--ease);
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: none; }
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 12px;
      border-radius: 18px;
      width: 100%;
      text-align: left;
      margin-bottom: 2px;
      cursor: pointer;
    }

    .row.sel {
      background: var(--canvas);
    }

    .row:hover {
      background: var(--canvas);
    }

    .row .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: none;
    }

    .row svg {
      color: var(--ink7);
      flex: none;
    }

    .row .nm {
      flex: 1;
      font-weight: 700;
      font-size: 15px;
    }

    .row .pc {
      font-size: 12px;
      color: var(--ink6);
      font-weight: 600;
      margin-left: 8px;
    }

    .row .am {
      font-weight: 800;
      font-size: 15px;
    }

    .empty {
      text-align: center;
      color: var(--ink6);
      font-size: 14px;
      padding: 20px;
    }

    .amt {
      display: flex;
      align-items: baseline;
      gap: 8px;
      border-bottom: 2px solid var(--ink6);
      padding: 0 0 6px;
      transition: border-color .25s;
    }

    .amt:focus-within {
      border-color: var(--primary);
    }

    .amt span {
      font-weight: 700;
      font-size: 20px;
      color: var(--ink6);
    }

    .amt input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: none;
      outline: 0;
      font: 300 52px/60px 'Manrope', system-ui, sans-serif;
      letter-spacing: -.04em;
      color: var(--ink9);
      font-variant-numeric: tabular-nums;
    }

    .amt input::placeholder {
      color: var(--ink6);
      opacity: .45;
    }

    .qk {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .pill {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .pill:hover {
      background: var(--canvas);
    }

    .pill.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--onp);
    }

    .pls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lbl {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0 10px;
    }

    .lbl .ov {
      color: var(--ink6);
    }

    .cats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cat {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 84px;
      border-radius: 22px;
      border: 1px solid var(--line2);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink7);
      cursor: pointer;
    }

    .cat:hover {
      background: var(--canvas);
    }

    .cat.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--onp);
      transform: translateY(-3px);
    }

    .cat.on:after {
      content: "";
      position: absolute;
      top: 10px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--onp);
    }

    .f2 {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 12px;
      margin-top: 24px;
    }

    .f2 .ov {
      color: var(--ink6);
      margin-bottom: 8px;
    }

    input.t {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--ink6);
      border-radius: 14px;
      padding: 0 12px;
      font: 600 15px 'Manrope', system-ui, sans-serif;
      background: var(--surface);
      color: var(--ink9);
      outline: 0;
    }

    input.t:focus {
      border: 2px solid var(--primary);
      padding: 0 11px;
    }

    .cta {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 58px;
      margin-top: 24px;
      border-radius: 999px;
      background: var(--ink9);
      color: var(--surface);
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cta i {
      position: absolute;
      left: 24px;
      top: 50%;
      margin-top: -6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--dc, #DD2D90);
    }

    .cta.go i {
      animation: coin .55s var(--ease) forwards;
    }

    @keyframes coin {
      to { left: calc(100% - 36px); opacity: 0; }
    }

    .dnav {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .dnav > button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 20px;
      border: 1px solid var(--line2);
      display: grid;
      place-items: center;
    }

    .dnav > button:hover {
      background: var(--canvas);
    }

    .dnav label {
      flex: 1;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -.01em;
      position: relative;
      cursor: pointer;
      padding: 12px 0;
    }

    .dnav input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      cursor: pointer;
    }

    .sum {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      padding: 0 4px 18px;
    }

    .in { color: var(--income); }
    .out { color: var(--expense); }
    .tfc { color: var(--ink7); }

    .tx {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      animation: pop .35s var(--ease) both;
    }

    .tx.new {
      animation: pop .35s var(--ease) both, hl 1.6s ease-out;
    }

    @keyframes hl {
      from { background: var(--b100); }
      to { background: transparent; }
    }

    .tx .ic {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line2);
      display: grid;
      place-items: center;
      flex: none;
      color: var(--ink7);
    }

    .tx .m {
      flex: 1;
      min-width: 0;
    }

    .tx .m b {
      font-size: 15px;
    }

    .tx .m small {
      display: block;
      color: var(--ink6);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx .a {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
    }

    .tx .x {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: var(--ink6);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .tx .x:hover {
      background: var(--p100);
      color: var(--p700);
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(10, 26, 43, .55);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s var(--ease);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .scrim.on {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border-radius: 32px 32px 0 0;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .32s var(--ease);
      max-height: 85vh;
      overflow-y: auto;
    }

    .scrim.on .sheet {
      transform: none;
    }

    .grab {
      width: 42px;
      height: 5px;
      border-radius: 9px;
      background: var(--ink6);
      opacity: .4;
      margin: 0 auto 16px;
    }

    .sheet h3 {
      font-size: 20px;
      line-height: 28px;
      margin-bottom: 16px;
    }

    .wr {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 4px 8px 4px 14px;
      border-radius: 18px;
      background: var(--canvas);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .wr span {
      flex: 1;
    }

    .danger {
      background: var(--p100);
      color: var(--p700);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 80px);
      background: var(--ink9);
      color: var(--surface);
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      transition: all .32s var(--ease);
      z-index: 60;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.on {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .shake {
      animation: sk .35s;
    }

    @keyframes sk {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Collapsible Tren 6 Bulan */
    .trend-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .32s var(--ease);
    }

    .trend-body.open {
      grid-template-rows: 1fr;
    }

    .trend-inner {
      overflow: hidden;
      opacity: 0;
      transition: opacity .25s var(--ease);
    }

    .trend-body.open .trend-inner {
      opacity: 1;
    }

    .bar-rect {
      transition: height 0.6s var(--ease), y 0.6s var(--ease), opacity 0.3s ease;
    }

    @media (max-width: 360px) {
      .bal { font-size: 54px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, .bar-rect, .trend-body, .trend-inner {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- JAVASCRIPT ENGINE (100% PRESERVED & INTEGRATED) -->
  <script>
    /* ==========================================================================
       UTILITIES & ICON ENGINE
       ========================================================================== */
    const $ = selector => document.querySelector(selector);
    const $$ = selector => document.querySelectorAll(selector);

    const num = n => Math.abs(Math.round(n || 0)).toLocaleString('id-ID');
    const rp = n => 'Rp ' + num(n);
    const pad = n => String(n).padStart(2, '0');
    const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

    const escapeHtml = str => {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    // Vector Icon Paths (Clean geometric stroke paths)
    const P = {
      fork: 'M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 3c-2.2 2-3 4.6-3 8h3v10',
      glass: 'M6 3h12l-2 15a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3L6 3z M6 8h12 M13 1l2 2',
      pin: 'M12 21s-6-5.5-6-10.5a6 6 0 0 1 12 0C18 15.5 12 21 12 21zM12 12a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z',
      bag: 'M5 8h14l-1 12H6zM9 8V6.5a3 3 0 0 1 6 0V8',
      bolt: 'M13 3 5 14h6l-1 7 8-11h-6z',
      cup: 'M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3',
      dots: 'M5 12h.01M12 12h.01M19 12h.01',
      down: 'M12 4v12M6 11l6 6 6-6M5 21h14',
      star: 'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5l-5.4 3 1.2-6L3.3 9.3l6.1-.7z',
      lap: 'M5 6h14v10H5zM3 20h18',
      plus: 'M12 5v14M5 12h14',
      swap: 'M4 8h14l-3-3M20 16H6l3 3'
    };

    const svgIco = (k, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k] || P.dots}"/></svg>`;

    // Master Categories: Including "Minum"
    const CATS = {
      out: [
        ['fork', 'Makan'],
        ['glass', 'Minum'],
        ['pin', 'Transport'],
        ['bag', 'Belanja'],
        ['bolt', 'Tagihan'],
        ['cup', 'Nongkrong'],
        ['dots', 'Lainnya']
      ],
      in: [
        ['down', 'Gaji/Uang Saku'],
        ['star', 'Bonus'],
        ['lap', 'Freelance'],
        ['plus', 'Lainnya']
      ]
    };

    // Color Ramps for Donut & Categories
    const RAMP = {
      out: ['#B8146F', '#DD2D90', '#F566B4', '#F9A3D2', '#8A0F55', '#FCD0E7', '#E052A0'],
      in: ['#08557F', '#0E8DD0', '#7CC6EE', '#B5DEF5', '#0A6FA6', '#053A58', '#3996C6']
    };

    const COLW = ['#08557F', '#B8146F', '#0A1A2B', '#0A6FA6', '#0E8DD0', '#8A0F55'];
    const MON = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const todayS = iso(new Date());

    const ik = (t, c) => {
      if (t === 'tf') return 'swap';
      const found = (CATS[t] || []).find(x => x[1] === c);
      return found ? found[0] : (t === 'in' ? 'down' : 'dots');
    };

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ==========================================================================
       STORAGE & STATE (BACKWARD COMPATIBLE + DEDUPLICATION)
       ========================================================================== */
    const STORAGE_KEY_V2 = 'dompetku2';

    let S = {
      wallets: [
        { id: 1, e: '💵', n: 'Cash' },
        { id: 2, e: '🏦', n: 'Bank' },
        { id: 3, e: '🟠', n: 'ShopeePay' },
        { id: 4, e: '🟢', n: 'GoPay' }
      ],
      tx: [],
      nid: 1
    };

    const saveStorage = () => {
      try {
        localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(S));
      } catch (err) {
        console.error('Gagal menyimpan LocalStorage:', err);
      }
    };

    function getNextId() {
      let max = 0;
      if (Array.isArray(S.wallets)) {
        S.wallets.forEach(w => {
          const num = Number(w.id);
          if (!isNaN(num) && num > max) max = num;
        });
      }
      if (Array.isArray(S.tx)) {
        S.tx.forEach(x => {
          const id = Number(x.id);
          const w1 = Number(x.w);
          const w2 = Number(x.w2);
          if (!isNaN(id) && id > max) max = id;
          if (!isNaN(w1) && w1 > max) max = w1;
          if (!isNaN(w2) && w2 > max) max = w2;
        });
      }
      if (typeof S.nid === 'number' && S.nid > max) {
        max = S.nid;
      }
      const next = max + 1;
      S.nid = next + 1;
      return next;
    }

    function repairWalletsAndIds() {
      if (!Array.isArray(S.wallets) || S.wallets.length === 0) {
        S.wallets = [
          { id: 1, e: '💵', n: 'Cash' },
          { id: 2, e: '🏦', n: 'Bank' },
          { id: 3, e: '🟠', n: 'ShopeePay' },
          { id: 4, e: '🟢', n: 'GoPay' }
        ];
      }

      let max = 0;
      S.wallets.forEach(w => {
        const num = Number(w.id);
        if (!isNaN(num) && num > max) max = num;
      });
      if (Array.isArray(S.tx)) {
        S.tx.forEach(x => {
          const id = Number(x.id);
          const w1 = Number(x.w);
          const w2 = Number(x.w2);
          if (!isNaN(id) && id > max) max = id;
          if (!isNaN(w1) && w1 > max) max = w1;
          if (!isNaN(w2) && w2 > max) max = w2;
        });
      }

      const seen = new Set();
      let modified = false;

      S.wallets.forEach(w => {
        const id = Number(w.id);
        if (!id || isNaN(id) || id <= 0 || seen.has(id)) {
          max++;
          w.id = max;
          seen.add(w.id);
          modified = true;
        } else {
          w.id = id;
          seen.add(id);
        }
      });

      if (!S.nid || typeof S.nid !== 'number' || S.nid <= max) {
        S.nid = max + 1;
        modified = true;
      }

      if (modified) {
        saveStorage();
      }
    }

    // Load data from LocalStorage
    try {
      const saved = localStorage.getItem(STORAGE_KEY_V2) || localStorage.getItem('dompetku3');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          if (Array.isArray(parsed.wallets) && parsed.wallets.length > 0) {
            S.wallets = parsed.wallets;
          }
          if (Array.isArray(parsed.tx)) {
            S.tx = parsed.tx.filter(x => !(x.n === 'Gaji Bulanan' && x.a === 1500000) && !(x.n === 'Makan siang soto' && x.a === 35000) && !(x.n === 'Ongkos ojek online' && x.a === 20000));
          }
          if (typeof parsed.nid === 'number') {
            S.nid = Math.max(parsed.nid, S.tx.length + 1);
          }
        }
      }
    } catch (err) {
      console.warn('Gagal membaca LocalStorage:', err);
    }

    repairWalletsAndIds();

    // View State
    const V = {
      month: todayS.slice(0, 7), // YYYY-MM
      rt: 'out',                 // Rekap tab: 'out' | 'in'
      sel: null,                 // Kategori aktif yang dipilih
      ft: 'out',                 // Form catat tab: 'out' | 'in' | 'tf'
      fw: S.wallets[0] ? S.wallets[0].id : 1,
      fw2: S.wallets[1] ? S.wallets[1].id : (S.wallets[0] ? S.wallets[0].id : 2),
      fc: 'Makan',
      day: todayS,
      hf: 'all',
      amt: 0,
      trendOpen: false,
      newId: 0
    };

    function validateFormWallets() {
      if (!Array.isArray(S.wallets) || S.wallets.length === 0) return;
      if (!S.wallets.some(w => w.id === V.fw)) {
        V.fw = S.wallets[0].id;
      }
      if (S.wallets.length > 1) {
        if (!S.wallets.some(w => w.id === V.fw2) || V.fw2 === V.fw) {
          const alt = S.wallets.find(w => w.id !== V.fw);
          V.fw2 = alt ? alt.id : S.wallets[0].id;
        }
      } else {
        V.fw2 = S.wallets[0].id;
      }
    }
    validateFormWallets();

    let toastTimer = null;
    const toast = m => {
      const t = $('#toast');
      if (!t) return;
      t.textContent = m;
      t.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
    };

    const wn = id => S.wallets.find(w => w.id === id) || { n: 'Dompet', e: '' };
    const sum = list => list.reduce((tot, x) => tot + (x.a || 0), 0);
    const mTx = t => S.tx.filter(x => x.d.startsWith(V.month) && (!t || x.t === t));

    // Perhitungan Saldo Dompet (termasuk transfer)
    const balOf = id => S.tx.reduce((total, x) => {
      if (x.t === 'in' && x.w === id) return total + x.a;
      if (x.t === 'out' && x.w === id) return total - x.a;
      if (x.t === 'tf') {
        if (x.w === id) return total - x.a;
        if (x.w2 === id) return total + x.a;
      }
      return total;
    }, 0);

    // Segmented Control Helper
    const setSeg = (selector, keys, currentKey, activeColor) => {
      const el = $(selector);
      if (!el) return;
      const idx = keys.indexOf(currentKey);
      el.style.setProperty('--i', idx >= 0 ? idx : 0);
      if (activeColor) el.style.setProperty('--ac', activeColor);
      el.querySelectorAll('button').forEach(btn => {
        const val = btn.dataset.t || btn.dataset.f;
        btn.classList.toggle('on', val === currentKey);
      });
    };

    // Tween Animation Engine
    function tween(el, to, formatter) {
      if (!el) return;
      const from = el._v || 0;
      el._v = to;
      cancelAnimationFrame(el._r);
      if (reduce || from === to || isNaN(from) || isNaN(to)) {
        el.textContent = formatter(to);
        return;
      }
      const t0 = performance.now();
      (function frame(t) {
        const p = Math.min((t - t0) / 600, 1);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = formatter(p < 1 ? Math.round(from + (to - from) * e) : to);
        if (p < 1) el._r = requestAnimationFrame(frame);
      })(t0);
    }

    /* ==========================================================================
       1. HEAD & TOTAL SALDO (HERO)
       ========================================================================== */
    function renderHead() {
      const [y, m] = V.month.split('-');
      const mIdx = parseInt(m, 10) - 1;
      const monthName = MON[mIdx] || '-';

      $('#ml').textContent = `${monthName} ${y}`;
      $('#rm').textContent = `${monthName.slice(0, 3)} ${y}`;

      const totalIn = sum(S.tx.filter(x => x.t === 'in'));
      const totalOut = sum(S.tx.filter(x => x.t === 'out'));
      const net = totalIn - totalOut;

      tween($('#bal'), net, v => (v < 0 ? '−' : '') + num(v));
      tween($('#hin'), sum(mTx('in')), v => '+' + rp(v));
      tween($('#hout'), sum(mTx('out')), v => '−' + rp(v));
    }

    /* ==========================================================================
       2. REKAP BULANAN & INTERACTIVE DONUT CHART
       ========================================================================== */
    function groups() {
      const map = {};
      mTx(V.rt).forEach(x => {
        map[x.c] = (map[x.c] || 0) + x.a;
      });
      return Object.entries(map).map(([c, a]) => ({ c, a })).sort((a, b) => b.a - a.a);
    }

    function renderDonut(anim = true) {
      setSeg('#rtab', ['out', 'in'], V.rt, V.rt === 'out' ? 'var(--p500)' : 'var(--b600)');

      const g = groups();
      const tot = sum(g);
      const R = 70;
      const C = 2 * Math.PI * R;
      const cl = RAMP[V.rt] || RAMP.out;
      const mid = {};
      let off = 0;

      const segs = g.map((x, i) => {
        const L = (x.a / tot) * C;
        const o = off;
        off += L;
        mid[x.c] = o + L / 2;
        return {
          c: x.c,
          len: Math.max(L - (g.length > 1 ? 3 : 0), 0),
          o,
          col: cl[i % cl.length]
        };
      });

      const rot = V.sel && mid[V.sel] !== undefined ? (-mid[V.sel] / C) * 360 : -90;
      const sv = $('#svg');

      if (anim || !sv.querySelector('#rg')) {
        sv.innerHTML = `
          <g id="rg" style="transform-origin:100px 100px;transform:rotate(${rot}deg);transition:transform .7s var(--ease)">
            <circle cx="100" cy="100" r="${R}" fill="none" style="stroke:var(--canvas);stroke-width:26px" />
            ${segs.map(s => `
              <circle 
                data-c="${escapeHtml(s.c)}" 
                data-d="${s.len.toFixed(2)} ${C.toFixed(2)}" 
                cx="100" 
                cy="100" 
                r="${R}" 
                stroke="${s.col}" 
                stroke-width="26" 
                stroke-dasharray="${anim && !reduce ? '0 ' + C : s.len.toFixed(2) + ' ' + C}" 
                stroke-dashoffset="${(-s.o).toFixed(2)}" 
                style="opacity:${V.sel && V.sel !== s.c ? .35 : 1}" 
              />
            `).join('')}
          </g>
          <circle cx="196" cy="100" r="5" style="fill:var(--p500);stroke:var(--paper);stroke-width:2px" />
        `;

        if (anim && !reduce) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              sv.querySelectorAll('circle[data-d]').forEach((c, i) => {
                c.style.transition = `stroke-dasharray .8s var(--ease) ${i * 70}ms, stroke-width .3s, opacity .3s`;
                c.setAttribute('stroke-dasharray', c.dataset.d);
              });
            });
          });
        }
      } else {
        sv.querySelectorAll('circle[data-c]').forEach(c => {
          const isSelected = c.dataset.c === V.sel;
          c.style.strokeWidth = isSelected ? '34px' : '26px';
          c.style.opacity = V.sel && !isSelected ? .35 : 1;
        });
        const rg = $('#rg');
        if (rg) rg.style.transform = `rotate(${rot}deg)`;
      }

      const s = g.find(x => x.c === V.sel);
      const ctr = $('#ctr');

      if (s) {
        ctr.innerHTML = `
          <div class="fade">
            ${svgIco(ik(V.rt, s.c), 28)}
            <div class="n">${escapeHtml(s.c)}</div>
            <div class="v">${rp(s.a)}</div>
            <div class="p">${Math.round((s.a / tot) * 100)}%</div>
          </div>
        `;
      } else {
        ctr.innerHTML = `
          <div class="fade">
            <div class="n">Total ${V.rt === 'out' ? 'keluar' : 'masuk'}</div>
            <div class="v">${rp(tot)}</div>
            <div class="p">${g.length} kategori</div>
          </div>
        `;
      }

      const listEl = $('#list');
      if (g.length > 0 && tot > 0) {
        listEl.innerHTML = g.map((x, i) => `
          <button type="button" class="row ${V.sel === x.c ? 'sel' : ''}" data-c="${escapeHtml(x.c)}">
            <span class="dot" style="background:${cl[i % cl.length]}"></span>
            ${svgIco(ik(V.rt, x.c), 20)}
            <span class="nm">${escapeHtml(x.c)}<span class="pc">${Math.round((x.a / tot) * 100)}%</span></span>
            <span class="am">${rp(x.a)}</span>
          </button>
        `).join('');
      } else {
        listEl.innerHTML = '<div class="empty">Belum ada transaksi bulan ini 🌱</div>';
      }
    }

    const pickCategory = c => {
      V.sel = V.sel === c ? null : c;
      renderDonut(false);
    };

    $('#svg').onclick = e => {
      const circle = e.target.closest('circle[data-c]');
      if (circle && circle.dataset.c) pickCategory(circle.dataset.c);
    };

    $('#list').onclick = e => {
      const r = e.target.closest('.row');
      if (r && r.dataset.c) pickCategory(r.dataset.c);
    };

    $('#rtab').onclick = e => {
      const btn = e.target.closest('button[data-t]');
      if (btn && btn.dataset.t !== V.rt) {
        V.rt = btn.dataset.t;
        V.sel = null;
        renderDonut(true);
      }
    };

    /* ==========================================================================
       3. SISA SALDO KANTONG / WALLETS SLIDER
       ========================================================================== */
    function renderWallets() {
      validateFormWallets();

      $('#wal').innerHTML = S.wallets.map((w, i) => {
        const b = balOf(w.id);
        const isSel = V.fw === w.id;
        return `
          <button type="button" class="wc ${isSel ? 'sel' : ''}" data-id="${w.id}" style="--c:${COLW[i % COLW.length]}">
            <small>${w.e ? w.e + ' ' : ''}${escapeHtml(w.n)}</small>
            <b>${b < 0 ? '−' : ''}${rp(b)}</b>
          </button>
        `;
      }).join('') + `
        <button type="button" class="wc add" id="btnManageWallets">
          <small>＋ Kelola</small>
          <b style="font-size:14px;font-weight:700">dompet</b>
        </button>
      `;

      const pills = (cur, dis) => S.wallets.map(w => `
        <button type="button" class="pill ${cur === w.id ? 'on' : ''}" data-id="${w.id}" ${dis === w.id ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>
          ${w.e ? w.e + ' ' : ''}${escapeHtml(w.n)}
        </button>
      `).join('');

      $('#fw').innerHTML = pills(V.fw, V.ft === 'tf' ? V.fw2 : 0);
      $('#fw2').innerHTML = pills(V.fw2, V.fw);
    }

    $('#wal').onclick = e => {
      const addBtn = e.target.closest('#btnManageWallets');
      if (addBtn) {
        openSheet();
        return;
      }
      const b = e.target.closest('.wc[data-id]');
      if (b) {
        V.fw = parseInt(b.dataset.id, 10);
        if (V.fw2 === V.fw) {
          V.fw2 = (S.wallets.find(w => w.id !== V.fw) || { id: V.fw }).id;
        }
        renderWallets();
      }
    };

    $('#fw').onclick = e => {
      const b = e.target.closest('.pill');
      if (b && !b.disabled && b.dataset.id) {
        V.fw = parseInt(b.dataset.id, 10);
        renderWallets();
      }
    };

    $('#fw2').onclick = e => {
      const b = e.target.closest('.pill');
      if (b && !b.disabled && b.dataset.id) {
        V.fw2 = parseInt(b.dataset.id, 10);
        renderWallets();
      }
    };

    $('#swap').onclick = () => {
      const temp = V.fw;
      V.fw = V.fw2;
      V.fw2 = temp;
      renderWallets();
      toast(`Dompet ditukar: ${wn(V.fw).n} ⇄ ${wn(V.fw2).n}`);
    };

    /* ==========================================================================
       4. FORM CATAT CEPAT
       ========================================================================== */
    function renderForm() {
      setSeg('#ftab', ['out', 'in', 'tf'], V.ft, V.ft === 'out' ? 'var(--p500)' : V.ft === 'in' ? 'var(--b600)' : 'var(--ink6)');

      const tf = V.ft === 'tf';
      $('#w2s').hidden = !tf;
      $('#cs').hidden = tf;
      $('#wl1').textContent = tf ? 'Dari dompet' : 'Dompet';

      const catList = CATS[V.ft] || [];
      if (!tf && !catList.some(c => c[1] === V.fc)) {
        V.fc = catList[0] ? catList[0][1] : 'Makan';
      }

      if (!tf) {
        $('#fc').innerHTML = catList.map(c => `
          <button type="button" class="cat ${V.fc === c[1] ? 'on' : ''}" data-c="${escapeHtml(c[1])}">
            ${svgIco(c[0], 24)}
            <span>${escapeHtml(c[1])}</span>
          </button>
        `).join('');
      }

      $('#sl').textContent = tf ? 'Simpan Transfer' : V.ft === 'out' ? 'Simpan Pengeluaran' : 'Simpan Pemasukan';
      $('#save').style.setProperty('--dc', tf ? '#0A6FA6' : V.ft === 'out' ? '#DD2D90' : '#0E8DD0');

      renderWallets();
    }

    $('#ftab').onclick = e => {
      const btn = e.target.closest('button[data-t]');
      if (btn && btn.dataset.t) {
        V.ft = btn.dataset.t;
        renderForm();
      }
    };

    $('#fc').onclick = e => {
      const b = e.target.closest('.cat');
      if (b && b.dataset.c) {
        V.fc = b.dataset.c;
        renderForm();
      }
    };

    const setAmt = n => {
      V.amt = Math.max(0, Math.floor(n || 0));
      $('#amt').value = V.amt ? V.amt.toLocaleString('id-ID') : '';
    };

    $('#amt').oninput = e => {
      const raw = parseInt(e.target.value.replace(/\D/g, '').slice(0, 12), 10) || 0;
      setAmt(raw);
    };

    $('#qk').onclick = e => {
      const btn = e.target.closest('button[data-v]');
      if (btn) {
        const v = btn.dataset.v;
        if (v === '0') setAmt(0);
        else setAmt(V.amt + parseInt(v, 10));
      }
    };

    const triggerShake = msg => {
      const box = $('#amtbox');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      toast(msg);
    };

    $('#save').onclick = () => {
      if (!V.amt || V.amt <= 0) return triggerShake('Isi nominal dulu ya!');
      if (V.ft === 'tf' && V.fw === V.fw2) return triggerShake('Dompet asal dan tujuan harus berbeda!');

      const d = $('#fd').value || todayS;
      const n = new Date();
      const timeStr = `${pad(n.getHours())}.${pad(n.getMinutes())}`;
      const noteStr = ($('#fn').value || '').trim();
      const isTransfer = V.ft === 'tf';

      let newTx;
      if (isTransfer) {
        newTx = {
          id: getNextId(),
          t: 'tf',
          w: V.fw,
          w2: V.fw2,
          a: V.amt,
          d,
          tm: timeStr,
          n: noteStr
        };
      } else {
        newTx = {
          id: getNextId(),
          t: V.ft,
          c: V.fc,
          w: V.fw,
          a: V.amt,
          d,
          tm: timeStr,
          n: noteStr
        };
      }

      S.tx.unshift(newTx);
      saveStorage();
      V.newId = newTx.id;

      // Animasi Coin CTA
      const b = $('#save');
      const dot = $('#dot');
      if (b) b.classList.add('go');
      if (dot) dot.classList.add('go');
      setTimeout(() => {
        if (b) b.classList.remove('go');
        if (dot) dot.classList.remove('go');
      }, 700);

      setAmt(0);
      $('#fn').value = '';
      toast(isTransfer ? 'Transfer berhasil dicatat ✓' : 'Transaksi tersimpan ✓');

      V.day = d;
      V.month = d.slice(0, 7);
      V.sel = null;
      renderAll(true);
    };

    /* ==========================================================================
       5. RIWAYAT TRANSAKSI HARIAN
       ========================================================================== */
    const shift = (s, days) => {
      const d = new Date(s + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return iso(d);
    };

    function renderHist() {
      const d = new Date(V.day + 'T00:00:00');
      const isToday = V.day === todayS;
      $('#dt').textContent = `${isToday ? 'Hari Ini, ' : ''}${d.getDate()} ${MON[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`;
      $('#dpick').value = V.day;

      const daily = S.tx.filter(x => x.d === V.day);
      const outAmt = sum(daily.filter(x => x.t === 'out'));
      const inAmt = sum(daily.filter(x => x.t === 'in'));

      $('#so').textContent = '↑ Keluar −' + rp(outAmt);
      $('#si').textContent = '↓ Masuk +' + rp(inAmt);
      $('#cnt').textContent = `${daily.length} transaksi`;

      setSeg('#hf', ['all', 'out', 'in', 'tf'], V.hf);

      const filtered = daily.filter(x => V.hf === 'all' || x.t === V.hf);
      const histEl = $('#hist');

      if (filtered.length === 0) {
        histEl.innerHTML = '<div class="empty">Tidak ada transaksi di tanggal ini 🍃</div>';
      } else {
        histEl.innerHTML = filtered.map(x => {
          const tf = x.t === 'tf';
          const sg = tf ? '' : x.t === 'in' ? '+' : '−';
          const ar = tf ? '⇄' : x.t === 'in' ? '↓' : '↑';
          const title = tf ? `${wn(x.w).n} → ${wn(x.w2).n}` : x.c;
          const sub = `${tf ? '' : (wn(x.w).n + ' · ')}Pukul ${x.tm || '--.--'}${x.n ? ' · ' + escapeHtml(x.n) : (tf ? ' · Pindah Dana' : '')}`;

          return `
            <div class="tx ${x.id === V.newId ? 'new' : ''}">
              <div class="ic">${svgIco(ik(x.t, x.c), 20)}</div>
              <div class="m">
                <b>${escapeHtml(title)}</b>
                <small>${sub}</small>
              </div>
              <div class="a ${tf ? 'tfc' : x.t}">${sg}${rp(x.a)} ${ar}</div>
              <button type="button" class="x" data-id="${x.id}" aria-label="Hapus transaksi" title="Hapus transaksi">
                ${svgIco('plus', 18).replace('<path', '<path transform="rotate(45 12 12)"')}
              </button>
            </div>
          `;
        }).join('');
      }
    }

    $('#hist').onclick = e => {
      const b = e.target.closest('.x');
      if (b && b.dataset.id) {
        const id = parseInt(b.dataset.id, 10);
        if (confirm('Yakin ingin menghapus transaksi ini?')) {
          S.tx = S.tx.filter(x => x.id !== id);
          saveStorage();
          toast('Transaksi dihapus');
          renderAll(false);
        }
      }
    };

    $('#hf').onclick = e => {
      const btn = e.target.closest('button[data-f]');
      if (btn && btn.dataset.f) {
        V.hf = btn.dataset.f;
        renderHist();
      }
    };

    const goDay = newDay => {
      V.day = newDay;
      const m = newDay.slice(0, 7);
      const monthChanged = m !== V.month;
      V.month = m;
      V.sel = null;
      renderAll(monthChanged);
    };

    $('#dp').onclick = () => goDay(shift(V.day, -1));
    $('#dn').onclick = () => goDay(shift(V.day, 1));
    $('#dpick').onchange = e => {
      if (e.target.value) goDay(e.target.value);
    };

    const moveMonth = offset => {
      const [y, m] = V.month.split('-').map(Number);
      const d = new Date(y, m - 1 + offset, 1);
      V.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      V.sel = null;
      if (!V.day.startsWith(V.month)) {
        V.day = todayS.startsWith(V.month) ? todayS : `${V.month}-01`;
      }
      renderAll(true);
    };

    $('#mp').onclick = () => moveMonth(-1);
    $('#mn').onclick = () => moveMonth(1);

    /* ==========================================================================
       6. TREN 6 BULAN (COLLAPSIBLE DI BAWAH)
       ========================================================================== */
    function get6MonthsData() {
      const [currY, currM] = V.month.split('-').map(Number);
      const months = [];

      for (let i = 5; i >= 0; i--) {
        const d = new Date(currY, currM - 1 - i, 1);
        const isoMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        const shortName = MON[d.getMonth()].slice(0, 3);
        const fullLabel = `${MON[d.getMonth()]} ${d.getFullYear()}`;
        const inAmt = sum(S.tx.filter(x => x.d.startsWith(isoMonth) && x.t === 'in'));
        const outAmt = sum(S.tx.filter(x => x.d.startsWith(isoMonth) && x.t === 'out'));
        months.push({
          isoMonth,
          shortName,
          fullLabel,
          inAmt,
          outAmt,
          isSelected: isoMonth === V.month
        });
      }
      return months;
    }

    function renderTrend() {
      const months = get6MonthsData();
      const currentMonthData = months[5];
      const prevMonthData = months[4];

      const insightEl = $('#trendInsight');
      if (prevMonthData && prevMonthData.outAmt > 0) {
        const currOut = currentMonthData.outAmt;
        const prevOut = prevMonthData.outAmt;
        const diff = currOut - prevOut;
        const pct = Math.round((Math.abs(diff) / prevOut) * 100);

        if (diff > 0) {
          insightEl.style.background = 'var(--p100)';
          insightEl.style.color = 'var(--p700)';
          insightEl.innerHTML = `<span style="font-size:14px">↗</span> <div>Pengeluaran <b>naik ${pct}%</b> vs bln lalu (${rp(prevOut)})</div>`;
        } else if (diff < 0) {
          insightEl.style.background = 'var(--b100)';
          insightEl.style.color = 'var(--b800)';
          insightEl.innerHTML = `<span style="font-size:14px">↘</span> <div>Pengeluaran <b>hemat ${pct}%</b> vs bln lalu (${rp(prevOut)}) 🌱</div>`;
        } else {
          insightEl.style.background = 'var(--canvas)';
          insightEl.style.color = 'var(--ink7)';
          insightEl.innerHTML = `<span style="font-size:14px">↔</span> <div>Pengeluaran sama persis vs bulan lalu</div>`;
        }
      } else {
        insightEl.style.background = 'var(--canvas)';
        insightEl.style.color = 'var(--ink6)';
        insightEl.innerHTML = `<span>🌱</span> <div>Belum ada data pembanding bulan lalu</div>`;
      }

      updateTrendTooltip(V.month);

      const maxVal = Math.max(1000, ...months.map(m => Math.max(m.inAmt, m.outAmt)));
      const baselineY = 76;
      let svgHtml = '';

      // Grid Guidelines
      svgHtml += `
        <line x1="12" y1="16" x2="328" y2="16" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="12" y1="46" x2="328" y2="46" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="12" y1="${baselineY}" x2="328" y2="${baselineY}" stroke="var(--line2)" stroke-width="1.2" />
      `;

      months.forEach((m, idx) => {
        const groupCenterX = 15 + idx * 51.6 + 25.8;
        const barW = 10;
        const rx = 3;

        const hIn = m.inAmt > 0 ? Math.max(3, Math.round((m.inAmt / maxVal) * 54)) : 2;
        const yIn = baselineY - hIn;
        const xIn = groupCenterX - 11;

        const hOut = m.outAmt > 0 ? Math.max(3, Math.round((m.outAmt / maxVal) * 54)) : 2;
        const yOut = baselineY - hOut;
        const xOut = groupCenterX + 1;

        const opacity = m.isSelected ? 1 : 0.35;

        svgHtml += `
          <g data-m="${m.isoMonth}" class="cursor-pointer" opacity="${opacity}">
            <title>${m.fullLabel}: Masuk ${rp(m.inAmt)} | Keluar ${rp(m.outAmt)}</title>
            <rect x="${groupCenterX - 24}" y="6" width="48" height="96" fill="transparent" />

            <!-- Batang Masuk -->
            <rect x="${xIn.toFixed(1)}" y="${yIn}" width="${barW}" height="${hIn}" rx="${rx}" fill="var(--b700)" class="bar-rect" />

            <!-- Batang Keluar -->
            <rect x="${xOut.toFixed(1)}" y="${yOut}" width="${barW}" height="${hOut}" rx="${rx}" fill="var(--p700)" class="bar-rect" />

            <!-- Label Bulan -->
            ${m.isSelected ? `
              <rect x="${(groupCenterX - 16).toFixed(1)}" y="81" width="32" height="17" rx="8.5" fill="var(--primary)" />
              <text x="${groupCenterX.toFixed(1)}" y="93" text-anchor="middle" fill="var(--onp)" font-size="10" font-weight="800">
                ${m.shortName}
              </text>
            ` : `
              <text x="${groupCenterX.toFixed(1)}" y="93" text-anchor="middle" fill="var(--ink6)" font-size="10" font-weight="700">
                ${m.shortName}
              </text>
            `}
          </g>
        `;
      });

      $('#trendSvg').innerHTML = svgHtml;
    }

    function updateTrendTooltip(isoMonth) {
      const [y, m] = isoMonth.split('-').map(Number);
      const monthName = MON[m - 1];
      const inAmt = sum(S.tx.filter(x => x.d.startsWith(isoMonth) && x.t === 'in'));
      const outAmt = sum(S.tx.filter(x => x.d.startsWith(isoMonth) && x.t === 'out'));

      const ttEl = $('#trendTooltip');
      if (!ttEl) return;
      ttEl.innerHTML = `
        <span style="display:flex;align-items:center;gap:6px">
          <span>🗓️</span> <span>${monthName} ${y}</span>
          ${isoMonth === V.month ? '<span style="font-size:10px;background:var(--primary);color:var(--onp);padding:1px 6px;border-radius:999px;font-weight:800">Aktif</span>' : ''}
        </span>
        <span style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--b700)">+${rp(inAmt)}</span>
          <span style="color:var(--p700)">−${rp(outAmt)}</span>
        </span>
      `;
    }

    function updateTrendCollapse() {
      const body = $('#trendBody');
      const text = $('#trendToggleText');
      const chevron = $('#trendChevron');
      const btn = $('#btnToggleTrend');
      if (!body) return;

      if (V.trendOpen) {
        body.classList.add('open');
        text.textContent = 'Ciutkan';
        if (chevron) chevron.style.transform = 'rotate(180deg)';
        if (btn) btn.setAttribute('aria-expanded', 'true');
      } else {
        body.classList.remove('open');
        text.textContent = 'Buka';
        if (chevron) chevron.style.transform = 'rotate(0deg)';
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    }

    $('#trendHeader').onclick = () => {
      V.trendOpen = !V.trendOpen;
      updateTrendCollapse();
    };

    $('#trendSvg').onclick = e => {
      const g = e.target.closest('g[data-m]');
      if (g && g.dataset.m) {
        V.month = g.dataset.m;
        V.sel = null;
        if (!V.day.startsWith(V.month)) {
          V.day = todayS.startsWith(V.month) ? todayS : `${V.month}-01`;
        }
        renderAll(true);
      }
    };

    $('#trendSvg').onmouseover = e => {
      const g = e.target.closest('g[data-m]');
      if (g && g.dataset.m) updateTrendTooltip(g.dataset.m);
    };

    $('#trendSvg').onmouseleave = () => updateTrendTooltip(V.month);

    /* ==========================================================================
       7. BOTTOM SHEET: KELOLA DOMPET
       ========================================================================== */
    function renderWalletSheet() {
      $('#wl').innerHTML = S.wallets.map(w => `
        <div class="wr">
          <span>${w.e ? w.e + ' ' : ''}${escapeHtml(w.n)}</span>
          <button type="button" class="chip danger btn-del-w" data-id="${w.id}">Hapus</button>
        </div>
      `).join('');
    }

    function openSheet() {
      renderWalletSheet();
      $('#sc').classList.add('on');
    }

    function closeSheet() {
      $('#sc').classList.remove('on');
    }

    $('#btnCloseSheet').onclick = closeSheet;

    $('#sc').onclick = e => {
      if (e.target.id === 'sc') closeSheet();
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSheet();
    });

    $('#wl').onclick = e => {
      const btn = e.target.closest('.btn-del-w');
      if (!btn || !btn.dataset.id) return;
      const id = parseInt(btn.dataset.id, 10);

      if (S.tx.some(x => x.w === id || x.w2 === id)) {
        return toast('Dompet masih memiliki riwayat transaksi');
      }
      if (S.wallets.length <= 1) {
        return toast('Minimal harus menyisakan satu dompet');
      }

      S.wallets = S.wallets.filter(w => w.id !== id);
      validateFormWallets();
      saveStorage();
      renderWalletSheet();
      renderWallets();
      toast('Dompet dihapus');
    };

    $('#wadd').onclick = () => {
      const name = ($('#wn').value || '').trim();
      const emoji = ($('#we').value || '').trim() || '💳';

      if (!name) {
        toast('Silakan isi nama dompet');
        $('#wn').focus();
        return;
      }

      if (S.wallets.some(w => w.n.toLowerCase() === name.toLowerCase())) {
        toast('Nama dompet sudah ada');
        $('#wn').focus();
        return;
      }

      const newId = getNextId();
      S.wallets.push({ id: newId, e: emoji, n: name });
      $('#wn').value = '';
      $('#we').value = '💳';
      saveStorage();
      renderWalletSheet();
      validateFormWallets();
      renderWallets();
      toast('Dompet baru ditambahkan ✓');
    };

    /* ==========================================================================
       8. FITUR EXPORT DATA KE CSV
       ========================================================================== */
    function exportCsv() {
      let txList = S.tx;
      try {
        const raw = localStorage.getItem(STORAGE_KEY_V2);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.tx)) txList = parsed.tx;
        }
      } catch (err) {
        console.warn('Gagal membaca data saat export CSV:', err);
      }

      if (!txList || txList.length === 0) {
        toast('Belum ada transaksi untuk diekspor 🌱');
        return;
      }

      const headers = ['Tanggal', 'Tipe', 'Kategori', 'Nominal', 'Dompet', 'Catatan'];

      const escapeCsvCell = val => {
        if (val === null || val === undefined) return '""';
        const str = String(val);
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return `"${str}"`;
      };

      const sortedTx = [...txList].sort((a, b) => (b.d > a.d ? 1 : (b.d < a.d ? -1 : (b.id - a.id))));

      const rows = sortedTx.map(item => {
        const tanggal = item.d || '';
        let tipe = 'Pengeluaran';
        let kategori = item.c || '';
        let dompet = wn(item.w).n || 'Dompet';

        if (item.t === 'in') {
          tipe = 'Pemasukan';
        } else if (item.t === 'tf') {
          tipe = 'Transfer';
          kategori = 'Transfer Antar Dompet';
          dompet = `${wn(item.w).n} -> ${wn(item.w2).n}`;
        }

        const nominal = Math.abs(item.a || 0);
        const catatan = item.n || '';

        return [
          escapeCsvCell(tanggal),
          escapeCsvCell(tipe),
          escapeCsvCell(kategori),
          escapeCsvCell(nominal),
          escapeCsvCell(dompet),
          escapeCsvCell(catatan)
        ].join(',');
      });

      const csvContent = '\uFEFF' + headers.join(',') + '\r\n' + rows.join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Rekap_Keuangan_DompetKu.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      toast('Berhasil mengunduh CSV ✓');
    }

    const btnExport = $('#btnExportCsv');
    if (btnExport) btnExport.onclick = exportCsv;

    /* ==========================================================================
       INITIALIZATION
       ========================================================================== */
    function renderAll(anim = true) {
      renderHead();
      renderDonut(anim);
      renderWallets();
      renderForm();
      renderHist();
      renderTrend();
      updateTrendCollapse();
    }

    $('#fd').value = todayS;
    renderAll(true);
  </script>
</body>
</html>
