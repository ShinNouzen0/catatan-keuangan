<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2856"/>
      <stop offset="50%" stop-color="#171F44"/>
      <stop offset="100%" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CFFF4"/>
      <stop offset="100%" stop-color="#74FFED"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7EE0"/>
      <stop offset="100%" stop-color="#FE51D1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#050814" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with Midnight Abyss -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Aqua Jade luminous inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#74FFED" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Wallet / Purse Icon Graphic -->
  <g filter="url(#shadow)">
    <!-- Metallic Clasp Balls: Baby Pink & Aqua Jade -->
    <circle cx="236" cy="135" r="22" fill="url(#pinkGrad)"/>
    <circle cx="276" cy="135" r="22" fill="url(#jadeGrad)"/>

    <!-- Metallic Frame Bar: Aqua Jade -->
    <rect x="130" y="160" width="252" height="26" rx="10" fill="url(#jadeGrad)"/>

    <!-- Main Purse Body (Deep Abyss Container) -->
    <path d="M145 186 L367 186 L410 330 C416 376, 382 414, 335 414 L177 414 C130 414, 96 376, 102 330 Z" fill="#0E1430" stroke="#263363" stroke-width="4"/>
    
    <!-- Accent Flap Curve -->
    <path d="M145 186 L367 186 C354 265, 312 288, 256 288 C200 288, 158 265, 145 186 Z" fill="#171F44" stroke="#FE51D1" stroke-width="3"/>
    
    <!-- Center Clasp: Baby Pink & Aqua Jade -->
    <rect x="232" y="266" width="48" height="38" rx="12" fill="url(#pinkGrad)"/>
    <rect x="242" y="276" width="28" height="18" rx="6" fill="url(#jadeGrad)"/>

    <!-- Aqua Jade Stitching detail -->
    <path d="M125 335 C121 370, 145 398, 178 398 L334 398 C367 398, 391 370, 387 335" fill="none" stroke="#74FFED" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="8 6"/>
  </g>
</svg>