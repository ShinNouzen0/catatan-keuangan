<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Midnight Abyss) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202A5D"/>
      <stop offset="45%" stop-color="#171F44"/>
      <stop offset="100%" stop-color="#0B1026"/>
    </linearGradient>

    <!-- Aqua Jade Gradient -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5FFF6"/>
      <stop offset="60%" stop-color="#74FFED"/>
      <stop offset="100%" stop-color="#3BE2CD"/>
    </linearGradient>

    <!-- Baby Pink Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA4EA"/>
      <stop offset="50%" stop-color="#FE51D1"/>
      <stop offset="100%" stop-color="#D928AC"/>
    </linearGradient>

    <!-- Dual Neon Flow Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE51D1"/>
      <stop offset="100%" stop-color="#74FFED"/>
    </linearGradient>

    <!-- Card Inner Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2554"/>
      <stop offset="100%" stop-color="#0E1430"/>
    </linearGradient>

    <!-- Ambient Shadow for depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050814" flood-opacity="0.8"/>
    </filter>

    <filter id="glowJade" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle (iOS / Android Adaptive Shape) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>

  <!-- High-Tech Neon Border Outline -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Cosmic Glow Flares in Background -->
  <circle cx="160" cy="180" r="140" fill="#FE51D1" opacity="0.16" filter="blur(55px)"/>
  <circle cx="350" cy="330" r="150" fill="#74FFED" opacity="0.18" filter="blur(60px)"/>

  <!-- MAIN EMBLEM: THE MODERN FINTECH 'D' VAULT / WALLET -->
  <g filter="url(#softShadow)">
    
    <!-- 1. BACK CARD: Sliding Upwards / Growth Vector (Aqua Jade Neon Card) -->
    <g transform="translate(0, -6)">
      <!-- Neon Aura behind the card -->
      <rect x="186" y="118" width="206" height="136" rx="20" fill="#74FFED" opacity="0.25" filter="url(#glowJade)"/>
      
      <!-- Card Solid Face -->
      <rect x="186" y="118" width="206" height="136" rx="20" fill="url(#jadeGrad)"/>

      <!-- Card Security Chip (Metallic Dark Navy) -->
      <rect x="212" y="146" width="38" height="30" rx="7" fill="#0E1430"/>
      <!-- Chip Wire Grid -->
      <path d="M212 161 L250 161 M231 146 L231 176" stroke="#74FFED" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="231" cy="161" r="3.5" fill="#74FFED"/>

      <!-- Wireless Contactless Waves -->
      <path d="M336 142 C344 150, 344 162, 336 170" fill="none" stroke="#0E1430" stroke-width="3" stroke-linecap="round"/>
      <path d="M346 133 C358 145, 358 167, 346 179" fill="none" stroke="#0E1430" stroke-width="3" stroke-linecap="round"/>

      <!-- Card Top-Right Accent Stripe -->
      <path d="M302 118 L348 118 L318 136 L272 136 Z" fill="#ffffff" opacity="0.35"/>
    </g>

    <!-- 2. MAIN WALLET BODY (Midnight Abyss Deep Vault with Baby Pink Accent) -->
    <!-- Wallet Main Shell -->
    <rect x="106" y="194" width="300" height="198" rx="30" fill="url(#cardGrad)" stroke="#263363" stroke-width="3.5"/>

    <!-- Subtle Diagonal Pattern Lines on Wallet Surface -->
    <path d="M106 320 L232 194" stroke="#263363" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <path d="M106 360 L272 194" stroke="#263363" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>

    <!-- Dynamic Curved Front Pocket (Sculpted 'D' Arch) -->
    <path d="M106 250 C180 250, 240 216, 406 216 L406 362 C406 378, 392 392, 376 392 L136 392 C120 392, 106 378, 106 362 Z" fill="#0E1430" stroke="#263363" stroke-width="2.5"/>

    <!-- Upper Lip Neon Highlight (Flow from Baby Pink to Aqua Jade) -->
    <path d="M106 250 C180 250, 240 216, 406 216" fill="none" stroke="url(#flowGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- 3. WALLET ACCENT CLASP & EMBLEM: Stylized Monogram "D" Lock -->
    <!-- Clasp Base Plaque (Baby Pink Glowing Pill) -->
    <g filter="url(#glowPink)">
      <rect x="330" y="270" width="76" height="46" rx="16" fill="url(#pinkGrad)"/>
    </g>

    <!-- Clasp Inner Plate & LED Indicator -->
    <rect x="334" y="274" width="68" height="38" rx="13" fill="#131A3B"/>
    
    <!-- Glowing Aqua Jade Status Gem -->
    <circle cx="355" cy="293" r="6.5" fill="url(#jadeGrad)"/>
    <circle cx="355" cy="293" r="2.5" fill="#ffffff"/>

    <!-- Geometric "D" Monogram on Clasp -->
    <path d="M374 285 L382 285 C388 285, 392 288, 392 293 C392 298, 388 301, 382 301 L374 301 Z" fill="none" stroke="#74FFED" stroke-width="2.8" stroke-linejoin="round"/>
    <line x1="374" y1="285" x2="374" y2="301" stroke="#74FFED" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 4. SIGNATURE BRAND GLYPH: Modern Geometric Monogram "D" Emblem on Front -->
    <!-- Big Stylized "D" Emboss in Center-Left of Wallet -->
    <g opacity="0.95">
      <!-- Glow under glyph -->
      <path d="M168 280 L204 280 C234 280, 252 296, 252 322 C252 348, 234 364, 204 364 L168 364 Z" fill="none" stroke="#FE51D1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#glowPink)"/>
      
      <!-- Primary Sharp Stroke: Baby Pink to Aqua Jade -->
      <path d="M168 280 L204 280 C234 280, 252 296, 252 322 C252 348, 234 364, 204 364 L168 364 Z" fill="none" stroke="url(#flowGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Inner Ascending Arrow Head (Symbolizing Financial Growth & Wealth) -->
      <path d="M192 334 L212 314 M212 314 L197 314 M212 314 L212 329" fill="none" stroke="#74FFED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Tiny Glowing Star Sparkle (Top-right corner of wallet) -->
    <path d="M392 186 Q392 198 404 198 Q392 198 392 210 Q392 198 380 198 Q392 198 392 186 Z" fill="#74FFED"/>
  </g>
</svg>